# Facelock Hardware Quirks Database
#
# This file contains device-specific workarounds for cameras known to need
# special handling. Entries are matched by USB vendor:product ID first,
# then by device name pattern as a fallback.
#
# Fields:
#   vendor_id / product_id  - USB IDs (hex string, e.g. "8086")
#   name_pattern            - glob-like pattern matched against the WHOLE device
#                             name (fallback). NOT regex: only (?i) and .* are
#                             supported, and the pattern is anchored (#99).
#                             Because the matcher has no alternation, a token
#                             that can appear either at the start of a card
#                             string or in the middle of one needs TWO entries:
#                             a start-anchored form and a `.* `-prefixed,
#                             space-bounded form. That is why the name entries
#                             below come in pairs.
#   force_ir                - treat this device as an IR camera regardless of format detection
#   emitter_xu_guid         - UVC Extension Unit GUID for IR emitter control
#   emitter_xu_selector     - UVC XU control selector for emitter toggle
#   warmup_frames           - override device.warmup_frames for this camera
#   format_preference       - preferred pixel format (e.g. "GREY", "Y16 ", "YUYV");
#                             counts as IR evidence only when IR-typical and
#                             actually advertised by the capture node
#   y16_bit_depth           - verified effective bit depth of this sensor's Y16
#                             samples (8..=16, e.g. 10 for a 10-bit sensor).
#                             Required for Y16 authentication. Add only from
#                             hardware documentation or validation; scene
#                             calibration is not authentication evidence.
#   rotation                - image rotation in degrees (0, 90, 180, 270)
#   notes                   - human-readable explanation

# --- Intel RealSense ---
# No y16_bit_depth is shipped for these entries because facelock has no Y16
# hardware validation record. Their Y16 streams classify as IR but auth rejects
# recoverably until an evidence-backed local or shipped quirk supplies depth.

[[quirk]]
vendor_id = "8086"
product_id = "0b07"
force_ir = true
warmup_frames = 10
format_preference = "Y16 "
notes = "Intel RealSense SR300 IR camera"

[[quirk]]
vendor_id = "8086"
product_id = "0ad3"
force_ir = true
warmup_frames = 8
format_preference = "Y16 "
notes = "Intel RealSense D435 IR module"

[[quirk]]
vendor_id = "8086"
product_id = "0b5c"
force_ir = true
warmup_frames = 8
format_preference = "Y16 "
notes = "Intel RealSense D455 IR module"

# --- Lenovo ThinkPad IR cameras ---

# Anchored (#99): name_pattern matches the WHOLE device name, not a substring
# of it. The first entry covers card strings that literally START with "IR
# Camera" (a trailing wildcard still allows a model-number suffix, e.g. "IR
# Camera 5MP"); the second covers the far more common ThinkPad spelling, where
# "IR Camera" sits mid-string ("Integrated IR Camera"). The leading `.* ` is
# space-bounded, so it still rejects a name that merely CONTAINS the letters
# "ir" ("Sirius Camera", "AIR-Cam") — a bare leading `.*` would not.
[[quirk]]
name_pattern = "(?i)ir camera.*"
force_ir = true
warmup_frames = 8
notes = "ThinkPad integrated IR camera (various models)"

[[quirk]]
name_pattern = "(?i).* ir camera.*"
force_ir = true
warmup_frames = 8
notes = "ThinkPad integrated IR camera, vendor-prefixed name (various models)"

# --- Logitech BRIO ---

# The BRIO exposes multiple V4L2 capture nodes under one VID:PID: an RGB node
# (YUYV/MJPG) and an IR node (native GREY). force_ir means "this USB device has
# an IR sensor"; format_preference = "GREY" marks the IR sensor node so
# classification and auto-detection pick the GREY-native node, not the RGB one.
[[quirk]]
vendor_id = "046d"
product_id = "085e"
force_ir = true
warmup_frames = 1
format_preference = "GREY"
notes = "Logitech BRIO 4K with IR sensor"

# --- Microsoft Surface cameras ---

# Anchored (#99): each entry requires a word-bounded " ir" later in the name
# (the literal leading space stops an unrelated word ending in "...ir", e.g.
# "Air", from matching). The first requires the name to START with "surface";
# the second admits a vendor word before it, which is how Surface parts
# normally enumerate ("Microsoft Surface ... IR ...").
[[quirk]]
name_pattern = "(?i)surface.* ir.*"
force_ir = true
warmup_frames = 8
notes = "Microsoft Surface IR camera"

[[quirk]]
name_pattern = "(?i).* surface.* ir.*"
force_ir = true
warmup_frames = 8
notes = "Microsoft Surface IR camera, vendor-prefixed name"

[[quirk]]
vendor_id = "045e"
product_id = "0990"
force_ir = true
warmup_frames = 8
notes = "Microsoft Surface Pro IR camera"

# --- HP IR cameras ---

# Anchored (#99): see the ThinkPad/Surface entries above for the pattern
# rationale (vendor token + word-bounded " ir", in both a start-anchored and
# a space-bounded mid-name form — OEM cameras are often enumerated by their
# module maker, e.g. "Chicony HP IR Camera").
[[quirk]]
name_pattern = "(?i)hp.* ir.*"
force_ir = true
warmup_frames = 8
notes = "HP IR camera (various models)"

[[quirk]]
name_pattern = "(?i).* hp.* ir.*"
force_ir = true
warmup_frames = 8
notes = "HP IR camera, vendor-prefixed name (various models)"

# --- Dell IR cameras ---

[[quirk]]
name_pattern = "(?i)dell.* ir.*"
force_ir = true
warmup_frames = 8
notes = "Dell IR camera (various models)"

[[quirk]]
name_pattern = "(?i).* dell.* ir.*"
force_ir = true
warmup_frames = 8
notes = "Dell IR camera, vendor-prefixed name (various models)"
