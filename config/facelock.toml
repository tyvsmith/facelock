# Facelock — Linux face authentication
#
# All settings are optional. Facelock auto-detects the camera and uses
# sensible defaults. Uncomment and edit only what you need to change.
#
# Location: /etc/facelock/config.toml
# Override (unprivileged CLI only): set FACELOCK_CONFIG=/path/to/config.toml
# Privileged PAM/root auth flows ignore the environment and use either
# an explicit --config path or /etc/facelock/config.toml.


# ── Camera ──────────────────────────────────────────────────────────

[device]

# Camera device path. When omitted, Facelock auto-detects the best
# available camera, preferring IR cameras over RGB.
# path = "/dev/video2"

# Maximum frame height in pixels. Frames taller than this are
# downscaled to improve processing speed.
# Default: 480
# max_height = 480

# Rotate captured frames. Useful for cameras mounted sideways.
# Values: 0, 90, 180, 270
# Default: 0
# rotation = 0

# Frames to discard immediately after opening the camera so exposure
# and gain can stabilize. Hardware quirks may override this.
# Default: 2
# warmup_frames = 2

# Dark-frame rejection. If this fraction of pixels is below
# dark_pixel_value, the frame is treated as unusably dark.
# Defaults: threshold = 0.6, dark_pixel_value = 10
# dark_threshold = 0.6
# dark_pixel_value = 10

# Attempt to enable a controllable IR emitter when the camera opens.
# Only needed for hardware that does not auto-enable its IR LED.
# Default: false
# ir_emitter = false

# Daemon only. Seconds to keep the camera streaming after a FAILED
# authentication so an immediate retry skips the reopen cost. Cancellation
# and errors always release the camera at once — the interaction is over,
# so the IR LED goes out with it — and so does a success, unless the key
# below says otherwise.
# Set it to zero to never hold: every attempt reopens, no LED after a miss.
# Default: 3
# camera_release_secs = 3

# Daemon only. Seconds to keep the camera streaming after a SUCCESSFUL
# authentication as well. Zero, the default, releases it at once: the
# interaction is over, so holding on only keeps the camera (and on IR
# hardware its emitter LED) lit for a retry nobody is going to make.
# Raise it only if you repeat privileged actions with no authentication
# caching in front of them (sudo with a zero timestamp_timeout, a polkit
# action without auth_admin_keep), so each one is a fresh authentication
# that would otherwise pay a camera reopen.
# Default: 0
# camera_release_after_success_secs = 0


# ── Face Recognition ────────────────────────────────────────────────

[recognition]

# Cosine similarity threshold for accepting a face match.
# Higher values are stricter (fewer false accepts, more false rejects).
#
# Range guide (ArcFace cosine similarity):
#   0.30–0.50  Very loose — high false accept rate, not recommended
#   0.50–0.65  Loose — convenient but may accept similar-looking people
#   0.65–0.80  Balanced — good for most setups, low false accept rate
#   0.80–0.90  Strict — rarely accepts wrong person, may reject on bad angles
#   0.90+      Very strict — may require near-ideal lighting and pose
#
# Tip: run `facelock test` to see your similarity scores, then set the
# threshold below your typical match score with some margin.
#
# Default: 0.80
# threshold = 0.80

# Maximum seconds to attempt recognition before giving up.
# Default: 5
# timeout_secs = 5

# Seconds to keep looking when no face at all has been detected.
# Once a face is seen, timeout_secs above takes over — that is the case
# worth waiting out. Ending an empty-chair attempt early stops the camera
# (and on IR hardware its emitter LED) from running for nothing, and such an
# attempt never counts against the rate limit.
# Values above timeout_secs are clamped to it. 0 disables the early exit.
# Default: 2
# no_face_timeout_secs = 2

# ONNX model files (must exist in daemon.model_dir).
# Run `facelock setup` to select a model tier and download automatically.
#
# Available tiers:
#   Standard  (~170MB, fast) — default
#   Balanced  (~252MB, ~15-30ms slower)
#   High accuracy (~266MB, ~40-50ms slower)
#
# Default: "scrfd_2.5g_bnkps.onnx" / "w600k_r50.onnx" (standard)
# detector_model = "scrfd_2.5g_bnkps.onnx"
# Bundled models are verified against the manifest automatically.
# For custom model files, set the matching SHA256 explicitly.
# detector_sha256 = "..."
# embedder_model = "w600k_r50.onnx"
# embedder_sha256 = "..."

# ONNX Runtime execution provider.
# Values: "cpu", "cuda", "rocm", "openvino"
# GPU providers require installing a GPU-enabled ONNX Runtime package:
#   NVIDIA:  sudo pacman -S onnxruntime-opt-cuda
#   AMD:     install onnxruntime with ROCm support
#   Intel:   install openvino runtime
# Default: "cpu"
# execution_provider = "cpu"

# Number of CPU threads for ONNX inference.
# Default: 4
# threads = 4


# ── Daemon ──────────────────────────────────────────────────────────

[daemon]

# How the PAM module authenticates.
#
# "daemon"  — connects to a persistent daemon via D-Bus system bus (default).
#             Fast (~200ms) because models stay loaded in memory.
#             Starts automatically via D-Bus activation.
#
# "oneshot" — PAM spawns `facelock auth` per attempt. No daemon needed.
#             Slower (~700ms) but zero background processes.
#             Works on any Linux system, no systemd required.
#
# The CLI always works regardless of this setting — it silently falls
# back to direct mode when the daemon isn't running.
# Default: "daemon"
# mode = "daemon"

# Directory containing ONNX model files.
# Default: "/var/lib/facelock/models"
# model_dir = "/var/lib/facelock/models"

# Shut down the daemon after this many idle seconds (0 = never).
# Useful to save memory — the daemon restarts automatically via
# D-Bus activation on the next auth request.
# Default: 0
# idle_timeout_secs = 0


# ── Storage ─────────────────────────────────────────────────────────

[storage]

# SQLite database for face embeddings. Contains biometric data —
# file permissions should be 600 owned by root:root.
# Default: "/var/lib/facelock/facelock.db"
# db_path = "/var/lib/facelock/facelock.db"


# ── Security ────────────────────────────────────────────────────────

[security]

# Disable face authentication entirely. PAM returns IGNORE,
# falling through to the next auth method (usually password).
# Default: false
# disabled = false

# Refuse remote face auth. One-shot PAM checks its sanitized SSH
# environment; non-root daemon Authenticate requires a live D-Bus ProcessFD
# whose logind session is local. false skips that daemon lookup.
# Default: true
# abort_if_ssh = true

# Refuse face auth when the laptop lid is closed (camera blocked).
# Only relevant on laptops — desktops without a lid sensor are unaffected.
# Default: true
# abort_if_lid_closed = true

# IMPORTANT: Require an IR camera for authentication. RGB cameras
# are trivially spoofed with a printed photo. Only set to false
# for development/testing.
# Default: true
# require_ir = true

# Require multiple frames with different embeddings before accepting.
# Defends against static photo attacks — a real face produces slight
# variation between frames due to micro-movements.
# Default: true
# require_frame_variance = true

# Maximum cosine similarity allowed between consecutive matched frames,
# evaluated over a sliding window of the most recent min_auth_frames matches.
# Lower is stricter. Passive anti-photo only — it does NOT stop a video replay.
# Field-measured: truly static input (photo, paused replay) sits at >= ~0.999;
# a frozen, non-blinking live human sits at 0.98–0.995. The default (0.985) sits
# inside the frozen-human band for extra margin against static replays: a fully
# frozen user may be briefly delayed, but the sliding window recovers as soon as
# they move slightly (and password fallback always remains). Loosen toward 0.995
# if false rejects annoy you; tighten toward 0.97 for paranoia.
# Default: 0.985
# frame_variance_max_similarity = 0.985

# Minimum per-face standard deviation (measured on the RAW grayscale frame) for
# the IR texture check. Flat photos/screens score < 5 in IR; real skin > 15.
# Only applied on IR cameras. Lower to reduce false rejects, raise to be stricter.
# Default: 10.0
# ir_texture_min_stddev = 10.0

# Require landmark movement between frames to pass liveness check.
# Tracks facial landmark positions across frames to detect static images.
# Experimental; off by default.
# Default: false
# require_landmark_liveness = false

# Minimum pixel displacement for a landmark to count as "moving" between frames.
# Default: 1.5
# landmark_displacement_px = 1.5

# Number of facial landmarks (out of 5) that must show movement to pass liveness.
# Default: 3
# landmark_min_moving = 3

# Suppress warnings for unknown users (users with no enrolled face).
# Default: false
# suppress_unknown = false

# Minimum number of matching frames required before accepting. Also the size
# of the sliding window the frame-variance check evaluates: the most recent
# min_auth_frames matched frames must all drift pairwise.
# Only applies when require_frame_variance is true.
# Default: 3
# min_auth_frames = 3

# Device coupling — bind each enrolled template to the camera that captured it.
# At auth, a template whose enrolling-camera fingerprint does not match the live
# camera is skipped, so a swapped-in camera degrades to the password fallback
# (never a match, never a lockout). Advisory defense-in-depth only: the
# fingerprint is model-granularity (VID:PID) and forgeable by a programmable USB
# device — NOT attestation. See docs/security.md §1.D.
#
# Default: true
# bind_templates_to_device = true
#
# Match granularity: "model" (VID:PID, default — blocks a cross-model swap) or
# "unit" (VID:PID:serial — also blocks a same-model swap, but requires a camera
# that exposes a stable serial; enrollment at "unit" is refused otherwise).
# device_match_granularity = "model"
#
# Allow legacy templates (enrolled before device coupling, or on a camera with
# no readable USB identity — NULL device_id) to authenticate. Default true
# (allow-with-warn) so upgrades never lock anyone out; set false to require every
# template to carry a matching device id.
# bind_legacy_templates = true
#
# Hard device binding (opt-in). Folds the enrolling camera's device_id into the
# AES-GCM Additional Authenticated Data, so an encrypted template CANNOT be
# decrypted under a different camera — a cryptographic complement to the advisory
# skip-on-mismatch coupling above. Default FALSE: hard binding fails closed on
# unstable/absent device ids (which would otherwise degrade to password on every
# auth), so enable it only on hardware with a stable USB identity.
# bind_device_aad = false

# Allow storing plaintext (unencrypted) face templates. Only honored when
# encryption.method = "none". Default FALSE: enrollment refuses to write
# plaintext biometric data unless you explicitly opt in here. Encryption at rest
# (the default) does not depend on this flag.
# allow_plaintext = false

# Rate limiting — prevents brute-force attempts.
#
# [security.rate_limit]
# # Max auth attempts per user per window (default: 5)
# max_attempts = 5
# # Rate limit window in seconds (default: 60)
# window_secs = 60

# PAM service policy — allow/deny specific PAM service names.
# If allowed_services is non-empty, only those services may use facelock.
# denied_services always takes precedence.
#
# [security.pam_policy]
# allowed_services = ["sudo", "polkit-1"]
# denied_services = ["login", "sshd", "su"]


# ── Encryption ────────────────────────────────────────────────────

[encryption]

# How face embeddings are encrypted at rest. Run `facelock setup` to
# configure automatically.
#
#   "keyfile" — AES-256-GCM with a plaintext key file (DEFAULT)
#   "tpm"     — AES-256-GCM with a TPM-sealed key (recommended if TPM available)
#   "none"    — no encryption; stores plaintext biometric templates. Refused at
#               enrollment unless security.allow_plaintext = true.
#
# Default: "keyfile". Face templates are irreversible biometric data, so they
# are encrypted at rest by default. The key is auto-generated at 0600 on first
# use if absent. Set "none" only with security.allow_plaintext = true.
#
# With "tpm", the 32-byte AES key is sealed by the TPM at rest.
# At daemon startup, the key is unsealed and held in memory.
# Embeddings use the same AES-256-GCM format as "keyfile" — no
# re-encryption needed when migrating between methods.
#
# Migration commands:
#   sudo facelock tpm seal-key    # keyfile → tpm
#   sudo facelock tpm unseal-key  # tpm → keyfile
#   sudo facelock tpm reseal      # re-seal under current PCRs (recovery)
#
# method = "keyfile"

# Path to AES-256-GCM key file for keyfile method.
# Generated by `facelock setup` or `facelock tpm encrypt --generate-key`.
# Permissions should be 0600 (root read/write only).
# Default: "/etc/facelock/encryption.key"
# key_path = "/etc/facelock/encryption.key"

# Path to TPM-sealed AES key for tpm method.
# Generated by `facelock setup` or `facelock tpm seal-key`.
# Default: "/etc/facelock/encryption.key.sealed"
# sealed_key_path = "/etc/facelock/encryption.key.sealed"


# ── Notifications ───────────────────────────────────────────────────

[notification]

# Notification mode: controls how auth feedback is delivered.
#   "off"      — no notifications at all
#   "terminal" — PAM text prompts only ("Identifying face...", "Face recognized.")
#   "desktop"  — desktop popups only (via D-Bus/notify-send)
#   "both"     — terminal text and desktop popups
# Default: "terminal"
# mode = "terminal"

# Show prompt when scanning starts ("Identifying face...").
# Default: true
# notify_prompt = true

# Show notification on successful face match.
# Default: true
# notify_on_success = true

# Show notification on failed face match.
# Default: false (failure is already visible — you get a password prompt).
# Set explicitly here, unlike the options above: this key's per-field parser
# default disagrees with the type's overall default when the [notification]
# header is present but the key itself is omitted, so a fresh install must
# ship the value to get the documented behavior.
notify_on_failure = false


# ── Audit ─────────────────────────────────────────────────────────

[audit]

# Enable structured audit logging to a JSONL file.
# Each auth attempt is logged with timestamp, user, result, similarity,
# frame count, and duration. Useful for SIEM integration and compliance.
# Default: false
# enabled = false

# Path to the audit log file.
# Default: "/var/log/facelock/audit.jsonl"
# path = "/var/log/facelock/audit.jsonl"

# Rotate the log file when it exceeds this size (in MB).
# The old file is renamed to .jsonl.1 (single rotation).
# Default: 10
# rotate_size_mb = 10


# ── Snapshots ───────────────────────────────────────────────────────

[snapshots]

# Save camera snapshots on auth attempts for debugging or auditing.
#   "off"     — never save snapshots (default)
#   "all"     — save on every auth attempt
#   "failure" — save only on failed auth (debug false rejects / spoofing)
#   "success" — save only on successful auth (audit trail)
#
# Snapshots are saved as JPEG in the configured directory with timestamps.
# Default: "off"
# mode = "off"

# Directory for snapshot images.
# Default: "/var/log/facelock/snapshots"
# dir = "/var/log/facelock/snapshots"


# ── Polkit ─────────────────────────────────────────────────────────
#
# Controls the facelock polkit authentication agent. Face auth is SCOPED,
# not universal: a single face match must not authorize every privileged
# polkit action (pkexec, package install, disk mount, user admin).
#
# `face_eligible_actions` lists the polkit action_ids for which face auth
# may be offered. Any action NOT in the list is declined by the agent so
# polkit falls through to the password dialog (another agent handles it) —
# it is never denied outright.
#
# The default is a small, low-risk set. High-risk actions — pkexec
# (org.freedesktop.policykit.exec), PackageKit install/remove, udisks mount,
# accounts-service user administration — are intentionally EXCLUDED. Extend
# the list deliberately if you want face to reach further (like a fingerprint
# reader), then restart the agent. An empty list disables face for all
# actions.
#
# [polkit]
# face_eligible_actions = ["org.freedesktop.login1.lock-sessions"]


# ── PAM service files ──────────────────────────────────────────────
#
# Where `facelock pam add | remove | status` looks for PAM service
# files, in search order — Linux-PAM's own precedence, earliest wins.
#
# The FIRST entry is the override directory: every write lands there,
# and every later entry is read-only. A service that exists only in a
# later directory (polkit ships /usr/lib/pam.d/polkit-1 on Arch) is
# copied into the first one before the facelock line is inserted; the
# package-owned file is never modified.
#
# The default matches what Linux-PAM reads on a distribution that
# enables the vendor directory. Set this only if yours was compiled
# with a different one — never to put a package-owned directory first.
#
# [pam]
# config_dirs = ["/etc/pam.d", "/usr/lib/pam.d"]


# ── TPM ────────────────────────────────────────────────────────────
#
# TPM 2.0 settings for sealing the AES encryption key.
# When encryption.method = "tpm", these settings control how the
# 32-byte AES key is sealed/unsealed by the TPM at daemon startup.
#
# [tpm]
# seal_database = false          # Seal the SQLite database file with the TPM key (default: false)
# pcr_binding = false            # Bind sealed key to boot state (PCR values)
# pcr_indices = [0, 1, 2, 3, 7] # PCR registers to verify on unseal
# tcti = "device:/dev/tpmrm0"   # TPM communication interface
#
# pcr_binding = true is ENFORCED: unseal replays PolicyPCR on a real policy
# session, so a firmware/kernel update that changes a bound PCR makes the key
# refuse to unseal (face auth degrades to password — never a lockout). RECOVERY:
# after such a change, run `sudo facelock tpm reseal` to re-seal the key under the new
# PCR state. Keep a backup of encryption.key so reseal can recover the key even
# after the PCRs change — this is the recommended setup, since recovery then needs
# no re-enrollment. Honest tradeoff: while that backup exists, the tpm method's
# at-rest confidentiality against anyone who can read the file reduces to its 0600
# (root-only) protection. Default is false; enable only once you know the reseal
# workflow, since every bound-PCR change then needs a reseal.
