[package]
name = "facelock-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The domain layer (backend selection, health/status renderer, message seam,
# resolved-config, logging default, state layout, transport client) lives in
# this library so it can be integration-tested from `tests/` and shared, rather
# than being sealed inside a bin-only crate (gap D6). `src/main.rs` is the thin
# `facelock` binary: clap wiring plus dispatch into this library.
[lib]
name = "facelock_cli"
path = "src/lib.rs"

[[bin]]
name = "facelock"
path = "src/main.rs"

[dependencies]
facelock-core = { path = "../facelock-core" }
facelock-camera = { path = "../facelock-camera" }
facelock-face = { path = "../facelock-face" }
facelock-store = { path = "../facelock-store" }
facelock-daemon = { path = "../facelock-daemon" }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
indicatif = "0.18"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smithay-client-toolkit = { version = "0.21", optional = true }
wayland-client = { version = "0.31", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xkbcommon = { version = "0.9", optional = true }
dialoguer = "0.12"
signal-hook = "0.4"
thiserror = { workspace = true }
libc = "0.2"
nix = { version = "0.31", features = ["user", "socket"] }
facelock-tpm = { path = "../facelock-tpm" }
zbus = { version = "6", default-features = false, features = ["tokio-multithread", "proxy", "tracing"] }
tss-esapi = { workspace = true, optional = true }
zeroize = "1"
bytemuck = "1"

[dev-dependencies]
tempfile = "3"
# Schema-level failure injection lives in facelock-test-support::schema_faults,
# which owns the rusqlite dependency it needs.
facelock-test-support = { path = "../facelock-test-support" }

[features]
default = ["wayland"]
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:xkbcommon"]
tpm = ["facelock-tpm/tpm", "facelock-daemon/tpm", "dep:tss-esapi"]
