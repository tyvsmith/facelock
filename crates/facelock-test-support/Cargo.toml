[package]
name = "facelock-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
facelock-core = { path = "../facelock-core" }
# Raw SQL access for the schema-level fault injection in `schema_faults`.
# Kept here rather than duplicated in each consumer's dev-dependencies so the
# schema coupling those helpers encode lives in exactly one place.
rusqlite = { version = "0.41", features = ["bundled"] }
