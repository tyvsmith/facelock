{
  "specfile_path": "dist/facelock.spec",
  "upstream_package_name": "facelock",
  "downstream_package_name": "facelock",
  "upstream_tag_template": "v{version}",
  "actions": {
    "post-modifications": [
      "install -m 0755 dist/rpm/facelock-authselect-retirement-guard dist/facelock-authselect-retirement-guard"
    ]
  },
  "jobs": [
    {
      "job": "copr_build",
      "trigger": "release",
      "owner": "tyvsmith",
      "project": "facelock",
      "update_release": false,
      "enable_net": true,
      "targets": [
        "fedora-43-x86_64",
        "fedora-44-x86_64",
        "fedora-45-x86_64"
      ]
    },
    {
      "job": "copr_build",
      "trigger": "pull_request",
      "manual_trigger": true,
      "owner": "tyvsmith",
      "project": "facelock-testing",
      "enable_net": true,
      "targets": [
        "fedora-43-x86_64",
        "fedora-44-x86_64",
        "fedora-45-x86_64"
      ]
    }
  ]
}
