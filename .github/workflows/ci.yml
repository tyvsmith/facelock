name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a PR stacked on another PR's branch gets the same
  # gate as one targeting main. GitHub retargets it to main when its base
  # merges, so it would otherwise run CI for the first time only then.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/08/18/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm \
            git \
            rust \
            clang \
            v4l-utils \
            libxkbcommon \
            wayland \
            pam \
            tpm2-tss \
            python \
            just

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace

      - name: Build workspace with TPM
        run: cargo build --workspace --features tpm

      # --all-targets so test/bench code is linted too; without it a
      # deny-by-default lint in a test never fails CI. Keep in sync with the
      # justfile `lint` recipe, which is the same command.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy with TPM
        run: cargo clippy --workspace --all-targets --features tpm -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify documented commands and walkthrough contracts
        run: just check-docs

      # Build the PAM module ALONE — not via --workspace. `cargo build --workspace`
      # unifies features across crates, so facelock-cli/facelock-polkit (which both
      # request zbus ["tokio","blocking-api"]) silently repair an incoherent zbus
      # feature set in pam-facelock. That masks a real breakage: zbus's `blocking`
      # module is gated by `blocking-api`, NOT by the `blocking` feature, and with
      # default-features off you must also pick a runtime (`tokio` or `async-io`).
      # A standalone build is the only thing that proves the PAM crate compiles on
      # its own. Keep in sync with `just check-pam-standalone`.
      - name: Build pam-facelock in isolation
        run: cargo build -p pam-facelock

      # The whole point of PR #107 is to keep the PAM module's dependency surface
      # small, so forbid the async-io runtime backend: async-io/async-signal/polling
      # plus the async-executor/async-fs/async-lock trio that only the async-io zbus
      # backend pulls. We deliberately do NOT forbid signal-hook-registry: the
      # correct tokio backend pulls it transitively via tokio's "process" feature,
      # so listing it here would reject the very fix that shrinks the surface. If you
      # think you need to add signal-hook-registry back, you have probably
      # reintroduced the async-io backend — check for async-io first.
      # Keep in sync with `just check-pam-standalone`.
      - name: Verify pam-facelock dependency surface
        run: |
          cargo tree -p pam-facelock --edges normal --prefix none | awk '{print $1}' | sort -u > /tmp/pam-deps
          echo "pam-facelock crate count: $(wc -l < /tmp/pam-deps)"
          if grep -Eq '^(async-io|async-signal|async-executor|async-fs|async-lock|polling)$' /tmp/pam-deps; then
            echo "forbidden async-io backend crates in pam-facelock (expected the tokio backend)"
            exit 1
          fi
          echo "pam-facelock dependency guard passed"

      - name: Build release binaries
        run: |
          cargo build --release --workspace
          cargo build --release -p facelock-cli --features tpm

      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            target/release/facelock
            target/release/libpam_facelock.so
          retention-days: 1

  documentation-site:
    name: Documentation Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mandoc
          curl -fsSL --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz | tar xz
      - name: Check roff syntax
        run: mandoc -T lint -W error man/facelock.1 man/pam_facelock.8
      - name: Build and check the rendered site
        env:
          MDBOOK_BIN: ./mdbook
        run: bash test/build-docs-site.sh _site

  cargo-audit:
    name: Supply-chain Audit (cargo-audit)
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    # Override the workflow-level -Dwarnings: this job compiles cargo-audit's
    # own third-party dependency tree, which we don't control. A future
    # warning upstream shouldn't fail this job for reasons unrelated to the
    # audit itself. The real build/test/clippy jobs above keep -Dwarnings.
    env:
      RUSTFLAGS: ""
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/08/18/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm \
            git \
            rust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry and cargo-audit build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Ignore policy (with justifications) lives in .cargo/audit.toml.
      # Deny policy matches `just audit`: fail on any vulnerability (default),
      # unmaintained, or unsound advisory that is not explicitly ignored.
      - name: Run cargo audit
        run: cargo audit --deny unmaintained --deny unsound

  tpm-tests:
    name: TPM Tests (swtpm)
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    needs: build-and-test
    steps:
      - name: Install dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/08/18/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm \
            git \
            rust \
            clang \
            v4l-utils \
            libxkbcommon \
            wayland \
            pam \
            tpm2-tss \
            swtpm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start swtpm
        run: |
          mkdir -p /tmp/swtpm
          swtpm socket \
            --tpmstate dir=/tmp/swtpm \
            --tpm2 \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags startup-clear &
          sleep 2

      - name: Run TPM tests
        env:
          TCTI: swtpm:host=localhost,port=2321
        run: cargo test --workspace --features tpm

  agent-docs:
    name: Agent Docs Consistency
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/08/18/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm \
            fakeroot \
            git \
            just \
            perl \
            python \
            ripgrep \
            util-linux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize checkout trust metadata
        run: |
          checkout_owner="$(stat -c '%u:%g' -- "$GITHUB_WORKSPACE")"
          chown -R -- "$checkout_owner" "$GITHUB_WORKSPACE"
          chmod go-w -- "$GITHUB_WORKSPACE"

      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify agent docs still describe the tree
        run: just check-agent-docs "${{ github.event.pull_request.base.sha }}"

      - name: Verify workflow trust policy
        run: just check-workflow-policy

      - name: Verify source-install daemon lifecycle
        run: just test-source-install-daemon-lifecycle

      - name: Verify Debian source contract
        run: just test-deb-source-contract

      - name: Verify the Arch lane picks the package it means to install
        run: just test-arch-package-select

      - name: Verify the release publishes exactly once
        run: just test-release-artifacts

      - name: Verify release target declarations
        run: python3 test/check-release-matrix.py

      - name: Compare live production release channels with checked-in authority
        run: python3 test/check-live-release-channels.py

      - name: Compare the staging release channel with checked-in authority
        run: python3 test/check-live-release-channels.py --channel staging

  catalog-check:
    name: Translation Catalog Freshness
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel@sha256:714acd1eef9ae997d95691b1c5220ada0076185b77857c1813f02de0fa83cf7b
    steps:
      - name: Install system dependencies
        run: |
          printf '%s\n' 'Server = https://archive.archlinux.org/repos/2026/08/18/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm \
            git \
            gettext \
            just

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This is the only job that runs git against the checkout itself (the
      # others only run cargo/just), and inside a container git refuses it:
      # the steps run as root while /__w is owned by the runner uid, which
      # trips the dubious-ownership check. actions/checkout does add a
      # safe.directory entry, but only under a temporary HOME it discards when
      # the action finishes ("Temporarily overriding HOME=... before making
      # global git config changes" in its log), so later steps never see it.
      #
      # The symptom is not the usual "detected dubious ownership" fatal:
      # `git diff` supports --no-index, so it sets up the repository gently
      # and degrades a rejected repo to "not a git repository" — printing
      # "warning: Not a git repository. Use --no-index ..." plus its usage and
      # exiting 129 without ever comparing anything.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # po/*.pot are GENERATED from source by `just pot`. Nothing else
      # verifies the committed copies still match the code: `msgfmt
      # --check-format` (see the `mo` recipe) only validates the
      # `{placeholder}` contract of an existing translation against its own
      # msgid — it says nothing about whether msgids still correspond to
      # strings the code actually contains. A stale catalog (e.g. from a bad
      # merge/rerere resolution — this has already happened once, see
      # po/facelock.pot's history) passes every other gate silently.
      # Regenerate and diff: any drift fails the build.
      #
      # Deliberately NOT part of `just check`: PR #130 made the pot/mo
      # recipes opt-in and tolerant specifically so building, testing, and
      # `just check` never require gettext. Wiring `just pot` into `just
      # check` would silently reverse that and make xgettext a hard
      # dependency for every contributor just to catch one class of bug.
      # This job is CI-only for exactly that reason.
      #
      # POT-Creation-Date is excluded from the comparison because it is not
      # reproducible here. gettext 1.0's xgettext stamps it with the commit
      # timestamp of the newest input file when it can read the file's git
      # history, and falls back to the file's mtime when it cannot — and CI
      # checks out with fetch-depth 1, so it always takes the mtime path and
      # stamps the moment the runner cloned. Every other line (msgids, source
      # references, flags) is reproducible and is what this gate is about.
      - name: Verify translation catalogs are up to date
        run: |
          just pot
          git diff --exit-code -I '^"POT-Creation-Date: ' po/

      # `just check` runs this too, but skips its compile step where gettext is
      # absent. This job is the one place gettext is guaranteed, so it is where
      # a catalog is actually built and checked into a locale root.
      - name: Verify every install path ships compiled catalogs
        run: just test-locale-install-contract

  container-pam-test:
    name: Container PAM Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: target/release

      - name: Make binaries executable
        run: chmod +x target/release/facelock target/release/libpam_facelock.so

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # test/Containerfile bakes in models/*.onnx, which are gitignored, so CI
      # has always built the image without them -- and `facelock daemon`
      # verifies them at startup and refuses to run when they are absent. That
      # is what kept the camera-free assertions below out of CI even though
      # none of them opens a camera (#139). Fetched from the same `assets`
      # release `facelock setup` uses and verified against the checked-in
      # manifest, before the image is built. The packaging gates need the same
      # models for the same reason, so the fetch is a shared action (#229).
      - name: Fetch required ONNX models
        uses: ./.github/actions/fetch-models

      - name: Build test container
        run: |
          if [ ! -f test/Containerfile ]; then
            echo "No Containerfile found, skipping"
            exit 0
          fi
          podman build -t facelock-pam-test -f test/Containerfile .

      - name: Run container PAM tests
        run: |
          if [ -f test/Containerfile ]; then
            podman run --rm facelock-pam-test
          else
            echo "No Containerfile, skipping"
          fi

      # The camera-free half of the two end-to-end tiers (#139). Everything
      # here reaches its subject before any capture -- bus policy, ADR 010
      # authorization, pre-flight exit codes, schema migrations -- so it is
      # gated on every pull request instead of only when someone remembers to
      # sit in front of a camera. `just test-arch-camera-free` is the same run.
      - name: Run camera-free E2E tests
        run: podman run --rm facelock-pam-test /run-camera-free-tests.sh

      - name: Verify source-install lifecycle under systemd
        run: test/run-source-install-daemon-lifecycle-systemd.sh facelock-pam-test
