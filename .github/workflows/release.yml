name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

env:
  # ONNX Runtime version to bundle in the GitHub-Release .deb and .rpm packages.
  # The ort crate uses feature api-20, so the minimum supported ONNX Runtime is
  # 1.20; this bundled copy satisfies that floor. (The COPR RPM does not bundle
  # ORT — it depends on Fedora's system onnxruntime package via Packit.)
  ORT_VERSION: "1.20.1"
  ORT_SOURCE_URL: "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz"
  ORT_ARCHIVE_SHA256: "67db4dc1561f1e3fd42e619575c82c601ef89849afc7ea85a003abbac1a1a105"
  ORT_LIBRARY_SHA256: "a5faaf78a37590d3fe640f887620e74f6022d34550172b91ad2131bf0ad77d64"
  ORT_GIT_COMMIT: "5c1b7ccbff7e5141c1da7a9d963d660e5741c319"
  ORT_LICENSE: "MIT"

jobs:
  metadata:
    name: Validate Release Identity
    runs-on: ubuntu-latest
    outputs:
      cargo-version: ${{ steps.release.outputs.cargo-version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      arch-pkgver: ${{ steps.release.outputs.arch-pkgver }}
      debian-upstream: ${{ steps.release.outputs.debian-upstream }}
      debian-revision: ${{ steps.release.outputs.debian-revision }}
      rpm-version: ${{ steps.release.outputs.rpm-version }}
      rpm-counter: ${{ steps.release.outputs.rpm-counter }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag, package metadata, channels, and target matrix
        id: release
        run: |
          set -euo pipefail
          source scripts/release-versions.sh
          release_check_metadata "$GITHUB_REF_NAME"
          release_write_github_outputs "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"
          RELEASE_MATRIX_VERSION="${GITHUB_REF_NAME#v}" python3 test/check-release-matrix.py
          python3 test/check-rpm-ort-policy.py

  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: .github/workflows/scripts/install-ubuntu-deps.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp target/release/facelock release/facelock-x86_64-linux-gnu
          cp target/release/libpam_facelock.so release/pam_facelock.so
          if [ -f target/release/facelock-polkit-agent ]; then
            cp target/release/facelock-polkit-agent release/facelock-polkit-agent-x86_64-linux-gnu
          fi
          cd release && sha256sum * > SHA256SUMS

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Publish the release with a PAT, not the default GITHUB_TOKEN.
          # Releases created by GITHUB_TOKEN do not trigger downstream
          # automation, so Packit's release trigger never fires and COPR
          # is never built. An empty/missing RELEASE_PAT falls back to
          # GITHUB_TOKEN, so this is safe before the secret is set.
          token: ${{ secrets.RELEASE_PAT }}
          files: |
            release/facelock-x86_64-linux-gnu
            release/pam_facelock.so
            release/facelock-polkit-agent-x86_64-linux-gnu
            release/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease }}

  download-ort:
    name: Download ONNX Runtime
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Download ONNX Runtime for bundling
        run: |
          set -euo pipefail
          curl --output ort.tgz --proto '=https' --tlsv1.2 -fsSL "$ORT_SOURCE_URL"
          echo "$ORT_ARCHIVE_SHA256  ort.tgz" | sha256sum --check
          tar -xzf ort.tgz
          ORT_ROOT="onnxruntime-linux-x64-${ORT_VERSION}"
          test "$(cat "$ORT_ROOT/VERSION_NUMBER")" = "$ORT_VERSION"
          test "$(cat "$ORT_ROOT/GIT_COMMIT_ID")" = "$ORT_GIT_COMMIT"
          echo "$ORT_LIBRARY_SHA256  $ORT_ROOT/lib/libonnxruntime.so.${ORT_VERSION}" | sha256sum --check

          mkdir -p onnxruntime/lib
          cp "$ORT_ROOT/lib/libonnxruntime.so.${ORT_VERSION}" onnxruntime/lib/libonnxruntime.so
          cp "$ORT_ROOT/LICENSE" "$ORT_ROOT/ThirdPartyNotices.txt" \
             "$ORT_ROOT/VERSION_NUMBER" "$ORT_ROOT/GIT_COMMIT_ID" onnxruntime/
          cat > onnxruntime/PROVENANCE.md <<EOF
          ONNX Runtime ${ORT_VERSION} (${ORT_LICENSE})

          Upstream archive: ${ORT_SOURCE_URL}
          Archive SHA-256: ${ORT_ARCHIVE_SHA256}
          Upstream commit: ${ORT_GIT_COMMIT}
          Library SHA-256: ${ORT_LIBRARY_SHA256}
          EOF
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "component": "onnxruntime",
              "version": os.environ["ORT_VERSION"],
              "purl": f"pkg:github/microsoft/onnxruntime@{os.environ['ORT_VERSION']}",
              "license": os.environ["ORT_LICENSE"],
              "source_url": os.environ["ORT_SOURCE_URL"],
              "source_sha256": os.environ["ORT_ARCHIVE_SHA256"],
              "upstream_commit": os.environ["ORT_GIT_COMMIT"],
              "library_sha256": os.environ["ORT_LIBRARY_SHA256"],
              "provenance": "GitHub release archive tied to the reviewed upstream commit",
          }
          Path("onnxruntime/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          (cd onnxruntime && sha256sum \
            GIT_COMMIT_ID LICENSE PROVENANCE.md ThirdPartyNotices.txt VERSION_NUMBER \
            lib/libonnxruntime.so manifest.json > SHA256SUMS)
          test -s onnxruntime/SHA256SUMS
          (cd onnxruntime && sha256sum --check SHA256SUMS)

      - name: Upload ORT artifact
        uses: actions/upload-artifact@v7
        with:
          name: onnxruntime-bundle
          path: onnxruntime/

  build-deb:
    name: Build ${{ matrix.suite }} Debian Package
    runs-on: ubuntu-latest
    needs: [metadata, build, download-ort]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            variant: tpm
            architecture: amd64
            image: docker.io/library/debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          - suite: bookworm
            variant: legacy
            architecture: amd64
            image: docker.io/library/debian:12@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
          - suite: resolute
            variant: tpm
            architecture: amd64
            image: docker.io/library/ubuntu:26.04@sha256:6df9e8dd1eac389ebfef692c9648449adeb815d01e16e29cd6f3e50fe64ba9a6
          - suite: noble
            variant: legacy
            architecture: amd64
            image: docker.io/library/ubuntu:24.04@sha256:d78ab76437b1afc5f01e223d6bf0172763f404bb166441328845adbef44518cb
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates \
            build-essential \
            curl \
            pkg-config \
            libssl-dev \
            clang \
            libv4l-dev \
            libpam0g-dev \
            libxkbcommon-dev \
            libwayland-dev
          if [ "${{ matrix.variant }}" = tpm ]; then
            apt-get install -y libtss2-dev
          fi

      - name: Detect libtss2-esys package name and version
        id: tss
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant }}" = tpm ]; then
            TSS_PKG=$(dpkg -l 'libtss2-esys*' 2>/dev/null | awk '/^ii/{print $2}' | head -1)
            TSS_VER=$(dpkg -l 'libtss2-esys*' 2>/dev/null | awk '/^ii/{print $3}' | head -1)
            if [ -z "$TSS_PKG" ]; then
              echo "ERROR: No libtss2-esys package found"
              exit 1
            fi
            echo "TSS_DEPENDS=${TSS_PKG} (>= ${TSS_VER})" >> "$GITHUB_OUTPUT"
            echo "Found: ${TSS_PKG} ${TSS_VER}"
          else
            echo "TSS_DEPENDS=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release for suite variant
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          if [ "${{ matrix.variant }}" = tpm ]; then
            cargo build --release --workspace --features tpm
          else
            cargo build --release --workspace
          fi

      - name: Download ORT bundle
        uses: actions/download-artifact@v8
        with:
          name: onnxruntime-bundle
          path: onnxruntime

      - name: Verify ORT bundle exists
        run: (cd onnxruntime && sha256sum --check SHA256SUMS)

      - name: Build suite-specific .deb package
        run: |
          . "$HOME/.cargo/env"
          .github/workflows/scripts/build-deb.sh \
            "${{ needs.metadata.outputs.cargo-version }}" \
            "${{ matrix.suite }}" \
            "${{ needs.metadata.outputs.debian-revision }}" \
            "${{ steps.tss.outputs.TSS_DEPENDS }}"

      - name: Validate .deb contents
        run: .github/workflows/scripts/validate-deb.sh facelock_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.suite }}
          path: facelock_*.deb

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v3
        with:
          files: facelock_*.deb

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    needs: [metadata, build, download-ort]
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:fc3ec3da3ce49de0da0bab5a33223e90866c488d5d04fc6612284169e20a1bdb
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dnf install -y \
            rust cargo clang-devel \
            pam-devel libv4l-devel \
            rpm-build systemd-rpm-macros \
            util-linux python3 \
            gcc gcc-c++ \
            wayland-devel libxkbcommon-devel \
            tpm2-tss-devel

      - name: Download ORT bundle
        uses: actions/download-artifact@v8
        with:
          name: onnxruntime-bundle
          path: onnxruntime

      - name: Verify ORT bundle exists
        run: test -s onnxruntime/lib/libonnxruntime.so

      - name: Build release
        run: cargo build --release --workspace --features tpm

      - name: Build RPM
        run: .github/workflows/scripts/build-rpm.sh "${{ needs.metadata.outputs.cargo-version }}" "${{ needs.metadata.outputs.rpm-counter }}"

      - name: Copy RPM to workspace
        run: cp ~/rpmbuild/RPMS/x86_64/*.rpm ./ 2>/dev/null || cp ~/rpmbuild/RPMS/**/*.rpm ./ 2>/dev/null || true

      - name: Validate .rpm contents
        run: .github/workflows/scripts/validate-rpm.sh "$(ls *.rpm | head -1)" direct

      - name: Upload .rpm to release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.rpm"

  build-nix:
    name: Validate Nix Build
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Check flake
        run: nix flake check ./dist/nix --no-build
        continue-on-error: true

      - name: Build with Nix
        run: nix build ./dist/nix
        continue-on-error: true
        # Nix build may fail if onnxruntime hash changes.
        # This job validates the expression evaluates, not that
        # the build succeeds (which depends on nixpkgs state).

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [metadata, build, build-deb, build-rpm]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute source tarball checksum
        id: checksum
        run: |
          CHECKSUM=$(curl -sL "https://github.com/${{ github.repository }}/archive/${{ github.ref_name }}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "SHA256=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: .github/workflows/scripts/publish-aur.sh "${{ needs.metadata.outputs.cargo-version }}" "${{ steps.checksum.outputs.SHA256 }}"

  publish-apt:
    name: Publish APT Repository
    runs-on: ubuntu-latest
    needs: [metadata, build-deb]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Download trixie .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-trixie
          path: debs/trixie

      - name: Download bookworm .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-bookworm
          path: debs/bookworm

      - name: Download resolute .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-resolute
          path: debs/resolute

      - name: Download noble .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-noble
          path: debs/noble

      - name: Build APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          .github/workflows/scripts/publish-apt.sh "$(pwd)/apt-repo" \
            "trixie=$(ls debs/trixie/facelock_*.deb)" \
            "bookworm=$(ls debs/bookworm/facelock_*.deb)" \
            "resolute=$(ls debs/resolute/facelock_*.deb)" \
            "noble=$(ls debs/noble/facelock_*.deb)"

      - name: Package APT repo artifact
        run: |
          REPO_DIR="$(pwd)/apt-repo"
          # Remove reprepro internals (conf/, db/) — only ship dists/, pool/, and keyring
          tar -czf apt-repo.tar.gz -C "${REPO_DIR}" \
            --exclude='conf' --exclude='db' \
            dists pool tysmith-archive-keyring.gpg
          echo "APT repo tarball: $(du -h apt-repo.tar.gz | cut -f1)"

      - name: Upload APT repo to release
        uses: softprops/action-gh-release@v3
        with:
          files: apt-repo.tar.gz

  trigger-pages:
    name: Trigger Pages Rebuild
    runs-on: ubuntu-latest
    needs: [publish-apt]
    steps:
      - name: Trigger GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}"
          echo "Triggered Pages rebuild to include updated APT repository"
