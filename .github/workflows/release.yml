name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write

jobs:
  metadata:
    name: Validate Release Identity
    runs-on: ubuntu-latest
    outputs:
      cargo-version: ${{ steps.release.outputs.cargo-version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      arch-pkgver: ${{ steps.release.outputs.arch-pkgver }}
      debian-upstream: ${{ steps.release.outputs.debian-upstream }}
      debian-revision: ${{ steps.release.outputs.debian-revision }}
      rpm-version: ${{ steps.release.outputs.rpm-version }}
      rpm-counter: ${{ steps.release.outputs.rpm-counter }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag, package metadata, channels, and target matrix
        id: release
        run: |
          set -euo pipefail
          source scripts/release-versions.sh
          release_check_metadata "$GITHUB_REF_NAME"
          release_write_github_outputs "$GITHUB_REF_NAME" "$GITHUB_OUTPUT"
          RELEASE_MATRIX_VERSION="${GITHUB_REF_NAME#v}" python3 test/check-release-matrix.py
          python3 test/check-rpm-ort-policy.py

  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: .github/workflows/scripts/install-ubuntu-deps.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp target/release/facelock release/facelock-x86_64-linux-gnu
          cp target/release/libpam_facelock.so release/pam_facelock.so
          if [ -f target/release/facelock-polkit-agent ]; then
            cp target/release/facelock-polkit-agent release/facelock-polkit-agent-x86_64-linux-gnu
          fi
          cd release && sha256sum * > SHA256SUMS

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Publish the release with a PAT, not the default GITHUB_TOKEN.
          # Releases created by GITHUB_TOKEN do not trigger downstream
          # automation, so Packit's release trigger never fires and COPR
          # is never built. An empty/missing RELEASE_PAT falls back to
          # GITHUB_TOKEN, so this is safe before the secret is set.
          token: ${{ secrets.RELEASE_PAT }}
          files: |
            release/facelock-x86_64-linux-gnu
            release/pam_facelock.so
            release/facelock-polkit-agent-x86_64-linux-gnu
            release/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ needs.metadata.outputs.prerelease }}

  download-ort:
    name: Download ONNX Runtime
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Download ONNX Runtime for bundling
        run: |
          set -euo pipefail
          ort_source_url="$(scripts/prepare-ort-bundle.sh source-url)"
          curl --output ort.tgz --proto '=https' --tlsv1.2 -fsSL "$ort_source_url"
          scripts/prepare-ort-bundle.sh prepare ort.tgz onnxruntime
          scripts/prepare-ort-bundle.sh component-tar onnxruntime onnxruntime-bundle.tar.xz

      - name: Upload ORT artifact
        uses: actions/upload-artifact@v7
        with:
          path: onnxruntime-bundle.tar.xz
          archive: false

  prepare-cargo-vendor:
    name: Prepare Cargo Vendor Component
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned source-preparation toolchain
        # Immutable action implementation; the explicit patch release matches
        # the 1.95 channel selected by rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Prepare exact Cargo vendor component
        run: |
          scripts/prepare-cargo-vendor.sh prepare cargo-vendor
          scripts/prepare-cargo-vendor.sh component-tar cargo-vendor cargo-vendor-bundle.tar.xz

      - name: Upload Cargo vendor artifact
        uses: actions/upload-artifact@v7
        with:
          path: cargo-vendor-bundle.tar.xz
          archive: false

  build-deb:
    name: Build ${{ matrix.suite }} Debian Package
    runs-on: ubuntu-latest
    needs: [metadata, download-ort, prepare-cargo-vendor]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: trixie
            architecture: amd64
            image: docker.io/library/debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          - suite: resolute
            architecture: amd64
            image: docker.io/library/ubuntu:26.04@sha256:6df9e8dd1eac389ebfef692c9648449adeb815d01e16e29cd6f3e50fe64ba9a6
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap checkout dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ '${{ matrix.suite }}' = trixie ]; then
            printf '%s\n' 'deb http://deb.debian.org/debian trixie-backports main' \
              >/etc/apt/sources.list.d/trixie-backports.list
          fi
          apt-get update
          apt-get install -y \
            build-essential \
            clang \
            curl \
            debhelper \
            dpkg-dev \
            libpam0g-dev \
            libssl-dev \
            libtss2-dev \
            libv4l-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            python3 \
            ripgrep \
            util-linux-extra
          if [ '${{ matrix.suite }}' = trixie ]; then
            apt-get install -y -t trixie-backports \
              cargo \
              rustc
          else
            apt-get install -y \
              cargo \
              rustc
          fi
          dpkg-query -W -f='${Package} ${Version}\n' cargo rustc
          cargo --version
          rustc --version
          dpkg-query -S "$(command -v cargo)" "$(command -v rustc)"
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' cargo)" ge 1.88
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' rustc)" ge 1.88
          dpkg-checkbuilddeps

      - name: Download ORT bundle
        uses: actions/download-artifact@v8
        with:
          name: onnxruntime-bundle.tar.xz
          path: .
          skip-decompress: true

      - name: Extract exact ORT bundle
        run: scripts/prepare-ort-bundle.sh extract-component onnxruntime-bundle.tar.xz onnxruntime

      - name: Verify exact ORT bundle
        run: scripts/prepare-ort-bundle.sh verify onnxruntime

      - name: Download Cargo vendor bundle
        uses: actions/download-artifact@v8
        with:
          name: cargo-vendor-bundle.tar.xz
          path: .
          skip-decompress: true

      - name: Extract exact Cargo vendor bundle
        run: scripts/prepare-cargo-vendor.sh extract-component cargo-vendor-bundle.tar.xz cargo-vendor

      - name: Verify exact Cargo vendor bundle
        run: scripts/prepare-cargo-vendor.sh verify cargo-vendor

      - name: Validate Debian source contract
        run: |
          bash test/deb-source-contract.sh
          dpkg-checkbuilddeps

      - name: Build suite-specific .deb package
        id: deb
        run: |
          set -euo pipefail
          install -d -m700 /tmp/facelock-empty-cargo-home /tmp/facelock-empty-rustup-home
          test -z "$(find /tmp/facelock-empty-cargo-home -mindepth 1 -print -quit)"
          test -z "$(find /tmp/facelock-empty-rustup-home -mindepth 1 -print -quit)"
          CARGO_HOME=/tmp/facelock-empty-cargo-home \
          RUSTUP_HOME=/tmp/facelock-empty-rustup-home \
          .github/workflows/scripts/run-networkless.sh \
          .github/workflows/scripts/build-deb.sh \
            "${{ needs.metadata.outputs.cargo-version }}" \
            "${{ matrix.suite }}" \
            "${{ needs.metadata.outputs.debian-revision }}"
          source scripts/release-versions.sh
          package_version="$(release_debian_version \
            '${{ needs.metadata.outputs.cargo-version }}' \
            '${{ needs.metadata.outputs.debian-revision }}' \
            '${{ matrix.suite }}')"
          architecture="$(dpkg --print-architecture)"
          manifest="$PWD/facelock_${package_version}_${architecture}.manifest"
          test -f "$manifest"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Validate and stage exact Debian manifest
        run: |
          set -euo pipefail
          manifest='${{ steps.deb.outputs.manifest }}'
          bash test/deb-package-contract.sh --manifest "$manifest" --stage "$PWD/debian-upload"
          manifest_dir="$(dirname "$manifest")"
          while IFS= read -r artifact; do
            case "$artifact" in
              *.deb) .github/workflows/scripts/validate-deb.sh "$manifest_dir/$artifact" ;;
            esac
          done < "$manifest"

      - name: Upload exact Debian artifact set
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.suite }}
          path: debian-upload/

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v3
        with:
          files: debian-upload/*.deb

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    needs: [metadata, build, download-ort]
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:fc3ec3da3ce49de0da0bab5a33223e90866c488d5d04fc6612284169e20a1bdb
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dnf install -y \
            rust cargo clang-devel \
            pam-devel libv4l-devel \
            rpm-build systemd-rpm-macros \
            util-linux python3 \
            gcc gcc-c++ \
            wayland-devel libxkbcommon-devel \
            tpm2-tss-devel

      - name: Download ORT bundle
        uses: actions/download-artifact@v8
        with:
          name: onnxruntime-bundle.tar.xz
          path: .
          skip-decompress: true

      - name: Extract exact ORT bundle
        run: scripts/prepare-ort-bundle.sh extract-component onnxruntime-bundle.tar.xz onnxruntime

      - name: Verify exact ORT bundle
        run: scripts/prepare-ort-bundle.sh verify onnxruntime

      - name: Build release
        run: cargo build --release --workspace --features tpm

      - name: Build RPM
        run: .github/workflows/scripts/build-rpm.sh "${{ needs.metadata.outputs.cargo-version }}" "${{ needs.metadata.outputs.rpm-counter }}"

      - name: Copy RPM to workspace
        run: cp ~/rpmbuild/RPMS/x86_64/*.rpm ./ 2>/dev/null || cp ~/rpmbuild/RPMS/**/*.rpm ./ 2>/dev/null || true

      - name: Validate .rpm contents
        run: .github/workflows/scripts/validate-rpm.sh "$(ls *.rpm | head -1)" direct

      - name: Upload .rpm to release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.rpm"

  build-nix:
    name: Validate Nix Build
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Check flake
        run: nix flake check ./dist/nix --no-build
        continue-on-error: true

      - name: Build with Nix
        run: nix build ./dist/nix
        continue-on-error: true
        # Nix build may fail if onnxruntime hash changes.
        # This job validates the expression evaluates, not that
        # the build succeeds (which depends on nixpkgs state).

  publish-aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    needs: [metadata, build, build-deb, build-rpm]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute source tarball checksum
        id: checksum
        run: |
          CHECKSUM=$(curl -sL "https://github.com/${{ github.repository }}/archive/${{ github.ref_name }}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "SHA256=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: .github/workflows/scripts/publish-aur.sh "${{ needs.metadata.outputs.cargo-version }}" "${{ steps.checksum.outputs.SHA256 }}"

  publish-apt:
    name: Publish APT Repository
    runs-on: ubuntu-latest
    needs: [metadata, build-deb]
    if: ${{ needs.metadata.outputs.prerelease == 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Download trixie .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-trixie
          path: debs/trixie

      - name: Download resolute .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: release-deb-resolute
          path: debs/resolute

      - name: Build APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          source scripts/release-versions.sh
          exact_deb_from_manifest() {
            local suite="$1"
            local package_version manifest manifest_dir
            local -a packages
            package_version="$(release_debian_version \
              '${{ needs.metadata.outputs.cargo-version }}' \
              '${{ needs.metadata.outputs.debian-revision }}' \
              "$suite")"
            manifest="debs/$suite/facelock_${package_version}_amd64.manifest"
            bash test/deb-package-contract.sh --manifest "$manifest" >&2
            manifest_dir="$(dirname "$manifest")"
            mapfile -t packages < <(grep -E '\.deb$' "$manifest")
            test "${#packages[@]}" -eq 1
            printf '%s/%s\n' "$manifest_dir" "${packages[0]}"
          }
          .github/workflows/scripts/publish-apt.sh "$(pwd)/apt-repo" \
            "trixie=$(exact_deb_from_manifest trixie)" \
            "resolute=$(exact_deb_from_manifest resolute)"

      - name: Package APT repo artifact
        run: |
          REPO_DIR="$(pwd)/apt-repo"
          # Remove reprepro internals (conf/, db/) — only ship dists/, pool/, and keyring
          tar -czf apt-repo.tar.gz -C "${REPO_DIR}" \
            --exclude='conf' --exclude='db' \
            dists pool tysmith-archive-keyring.gpg
          echo "APT repo tarball: $(du -h apt-repo.tar.gz | cut -f1)"

      - name: Upload APT repo to release
        uses: softprops/action-gh-release@v3
        with:
          files: apt-repo.tar.gz

  trigger-pages:
    name: Trigger Pages Rebuild
    runs-on: ubuntu-latest
    needs: [publish-apt]
    steps:
      - name: Trigger GitHub Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}"
          echo "Triggered Pages rebuild to include updated APT repository"
