# Container E2E test posture.
#
# The camera mounted into the container (v4l2loopback / a UVC RGB webcam) is an
# ordinary RGB device: it has no IR name token and no quirks force_ir entry, so
# under the (correct, stricter) IR classifier it is NOT an IR camera.
#
# require_ir is therefore set to false HERE ON PURPOSE so the live enroll/auth
# camera suites exercise the recognition path instead of short-circuiting on the
# IR gate. This is a deliberate test-harness choice, not the product default
# (which is require_ir = true). The dedicated refusal assertion in
# run-oneshot-tests.sh flips require_ir = true against this same RGB camera to
# prove the gate still fires.
#
# require_frame_variance is likewise disabled for the container: the synthetic /
# looped test camera does not produce the natural inter-frame micro-motion of a
# live face, so the passive frame-variance drift check would false-reject it.
[device]
max_height = 480
dark_threshold = 1.0

[recognition]
threshold = 0.80
timeout_secs = 10

# The [daemon] header below is deliberately present and deliberately empty.
#
# `model_dir` is NOT set: the built-in default (/var/lib/facelock/models) is
# already where test/Containerfile puts the ONNX files, so a pin would buy
# nothing.
#
# The HEADER itself must stay. run-container-tests.sh injects the oneshot
# env_clear fixture with `sed '/^\[daemon\]/a mode = ...\nauth_bin = ...'`, so
# deleting the header silently stops that fixture being applied: the capture
# stub never runs, /tmp/oneshot-child-env is never written, and three env_clear
# assertions fail with grep exit 2 rather than anything resembling the real
# cause.
[daemon]

[security]
disabled = false
require_ir = false
require_frame_variance = false

# The daemon resolves the lid from logind (org.freedesktop.login1.Manager
# .LidClosed) because ProcSubset=pid hides /proc/acpi from the packaged unit's
# mount namespace. These containers run a bare dbus-daemon with no logind on
# it, so the daemon cannot resolve the lid at all — and an unresolvable lid
# refuses, by design (issue #385). Disabled HERE ON PURPOSE so the D-Bus auth
# suites exercise the paths they are about instead of every Authenticate
# returning "lid state unavailable".
#
# This costs no coverage: there is no /proc/acpi in the container either, so
# the gate was already inert here before the logind read existed. Nothing in
# test/ asserts a daemon-backed authentication that the gate would change, on
# this tier or the booted real-systemd ones; a tier that watches a genuinely
# closed lid needs hardware.
abort_if_lid_closed = false
